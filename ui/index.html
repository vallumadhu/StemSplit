<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StemSplit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>StemSplit</h1>
        <p>Browser based audio separator <span>what it means</span></p>
    </header>

    <main>
        <div class="playground">
            <div class="source_wrapper">
                <div class="uploadbox">
                    <img src="assets/upload-solid-full.svg" alt="">
                </div>
                <input type="file" id="fileInput" accept="audio/*" hidden>
                <div class="source_player">
                    <audio src=""></audio>
                </div>
            </div>

            <div class="wire wire-h" id="wire1">
                <svg viewBox="0 0 100 2" preserveAspectRatio="none">
                    <line x1="0" y1="1" x2="100" y2="1" />
                </svg>
            </div>

            <div class="model_box">
                <label for="modelSelect" class="model-label">Model</label>
                <select name="model" id="modelSelect">
                    <option value="unet">UNet</option>
                </select>

                <dl class="model-stats">
                    <div>
                        <dt>Parameters</dt>
                        <dd>2M</dd>
                    </div>
                    <div>
                        <dt>Model size</dt>
                        <dd>26 MB</dd>
                    </div>
                    <div>
                        <dt>Inference memory</dt>
                        <dd>1 GB</dd>
                    </div>
                </dl>
            </div>
            <div class="wire wire-branch" id="wire2">
                <svg viewBox="0 0 100 200" preserveAspectRatio="none">
                    <path d="M0,100 L30,100 Q50,100 50,70 L50,30 Q50,0 70,0 L100,0" />
                    <path d="M0,100 L30,100 Q50,100 50,130 L50,170 Q50,200 70,200 L100,200" />
                </svg>
            </div>
            <div class="outputs">
                <div class="vocals_wrapper">
                    <p>Vocals</p>
                    <div class="audio_player_box">
                        <audio id="vocalsAudio" src="assets/A Classic Education - NightOwl.stem_vocals.mp3"></audio>

                        <div class="audio_player">
                            <button class="play_btn" id="vocals_play_btn" aria-label="Play">
                                <img src="assets/circle-play-solid-full.svg" alt="" class="icon-play">
                                <img src="assets/circle-pause-solid-full.svg" alt="" class="icon-pause" hidden>
                            </button>

                            <input type="range" id="vocals_seek" class="seek" min="0" max="100" value="0" step="0.05">

                            <span class="time" id="vocals_time">0:00</span>
                        </div>
                    </div>
                </div>
                <div class="instru_wrapper">
                    <p>Instrumental</p>
                    <div class="audio_player_box">
                        <audio id="instruAudio"
                            src="assets/A Classic Education - NightOwl.stem_instrumental.mp3"></audio>

                        <div class="audio_player">
                            <button class="play_btn" id="instru_play_btn" aria-label="Play">
                                <img src="assets/circle-play-solid-full.svg" alt="" class="icon-play">
                                <img src="assets/circle-pause-solid-full.svg" alt="" class="icon-pause" hidden>
                            </button>

                            <input type="range" id="instru_seek" class="seek" min="0" max="100" value="0" step="0.05">

                            <span class="time" id="instru_time">0:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
